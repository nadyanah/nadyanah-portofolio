<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nadyanah-Portofolio</title>
    <script>
      // NOTE: pakai createElement + appendChild (bukan document.body.innerHTML +=)
      // karena innerHTML += me-reparse SELURUH isi <body>, yang menghancurkan
      // node-node yang sedang dipegang Vue/Cropper.js/lucide. Efeknya: satu error
      // kecil bisa memicu error susulan "insertBefore"/"appendChild of null" karena
      // referensi DOM lama sudah tidak valid — bikin halaman ikut rusak/putih.
      function showDebugOverlay(html, topOffset) {
        const el = document.createElement('div');
        el.style.cssText = 'color:red; background:white; position:fixed; top:' + topOffset + 'px; left:0; right:0; z-index:99999; padding:20px; border-bottom:2px solid red;';
        el.innerHTML = html;
        document.body.appendChild(el);
      }
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        showDebugOverlay('<strong>ERROR:</strong> ' + msg + '<br>' + url + ' (line ' + lineNo + ')<br><pre>' + (error && error.stack ? error.stack : '') + '</pre>', 0);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        showDebugOverlay('<strong>PROMISE REJECTION:</strong> ' + event.reason, 50);
      });
    </script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons (CDN) — pinned to 0.561.0. Lucide v1.0+ removed all brand/social icons
         (facebook, instagram, twitter, linkedin, github, dribbble, etc), which this site still
         uses for social links. Do not bump to @latest without swapping those icons out first. -->    <script src="https://unpkg.com/lucide@0.561.0"></script>
    <!-- Tailwind CSS (compiled locally) -->
    <!--
      STYLING — how this project is set up now
      =========================================
      Tailwind used to be pre-compiled into a giant style.css file. The
      problem with that: any new Tailwind class you added to this HTML
      later had no matching CSS, because nothing was regenerating the
      stylesheet. That's fixed by loading Tailwind here as a normal
      <script> instead: it watches the page and generates styles for
      whatever classes it finds, live, no build step required. You can
      still open this file directly by double-clicking it — it just also
      needs an internet connection so the browser can fetch this script
      and the Google Font below.

      Brand colors/fonts are defined once in custom.css and wired into
      Tailwind via the config below, so "bg-brand-gold", "font-serif" etc.
      keep working exactly like before.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-cream': '#FCFAF7',
              'brand-bone': '#F4EFE6',
              'brand-charcoal': '#2C2825',
              'brand-gold': '#A07850',
              'brand-gold-dark': '#7A5C38',
              'brand-muted': '#8E877B',
              neutral: { 150: '#F0EEEB' },
            },
            fontFamily: {
              sans: ['var(--font-sans)'],
              serif: ['var(--font-serif)'],
              mono: ['var(--font-mono)'],
              hand: ['var(--font-hand)'],
            },
          },
        },
      };
    </script>
    <!-- Everything Tailwind can't do (fonts, brand color variables, the
         drawer, small animations) lives in this plain, hand-editable file. -->
    <link rel="stylesheet" href="custom.css" />
    <!-- Cropper.js: powers the "atur foto" crop/pan/zoom modal before any admin photo upload -->
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css" />
    <script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <!-- Data Configuration -->
    <script src="data.js"></script>
  </head>
  <body class="bg-brand-cream text-black font-sans relative">
    <div id="root" >
      <div v-if="dataLoading" class="min-h-screen flex items-center justify-center text-black font-mono text-sm tracking-widest uppercase">
        Memuat menu...
      </div>
      <div v-else-if="dataLoadError" class="min-h-screen flex items-center justify-center text-center px-6 text-red-600 font-mono text-sm max-w-md mx-auto">
        {{ dataLoadError }}
      </div>
      <template v-else>
      <!-- WELCOME / GREETING SCREEN — shown every time the site loads.
           Background is translucent (bg-brand-cream/85 + blur) on purpose,
           so the dotted brand pattern behind it peeks through just a little
           instead of hiding it completely. Click/tap anywhere to dismiss. -->
      <transition name="fade">
        <div v-if="showWelcome" @click="showWelcome = false"
             class="fixed inset-0 z-[100] bg-brand-cream/85 backdrop-blur-sm flex flex-col items-center justify-center px-6 text-center cursor-pointer select-none">
          <div class="max-w-xl mx-auto">
            <p class="font-hack font-semibold text-sm sm:text-base leading-normal text-black" style="white-space: pre-line;">{{ mainPageContent.welcomeQuote }}</p>
          </div>

          <div class="absolute bottom-10 left-8 sm:left-14 flex flex-col items-start gap-1.5">
            <!-- growing plant / sprout — clean, symmetric line drawing, animates growing in
                 stroke-by-stroke (stem → leaves) then idles with a
                 gentle sway once fully grown -->
            <svg viewBox="0 0 100 100" class="h-28 w-28 sm:h-32 sm:w-32 text-black plant-grow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path class="plant-path plant-path-stem" d="M50 94 C47 79 54 65 49 50 C45 38 52 27 47 12" />
              <path class="plant-path plant-path-leaf1" d="M50 61 C39 57 33 60 29 50 C39.5 46 49 50.5 50 61 Z" />
              <path class="plant-path plant-path-leaf2" d="M48 43 C59 39 65 29 61 20 C51 24.5 45.5 33 48 43 Z" />
              <path class="plant-path plant-path-leaf3" d="M47 25 C40 21.5 38 15 41 9 C47.5 12 50 18.5 47 25 Z" />
            </svg>
          </div>

          <p class="absolute bottom-4 right-6 text-sm sm:text-base font-mono uppercase tracking-widest text-brand-muted/70">{{ mainPageContent.welcomeCta }}</p>
        </div>
      </transition>

      <!-- DEKORASI PARALLAX BACKGROUND -->
      <div class="absolute inset-0 opacity-[0.02] pointer-events-none" 
           style="background-image: radial-gradient(var(--color-brand-charcoal) 1px, transparent 0), radial-gradient(var(--color-brand-charcoal) 1px, transparent 0); background-size: 24px 24px; background-position: 0 0, 12px 12px"></div>
      
      <!-- GLOBAL PERSISTENT FLOATING NAVIGATION DOCK — desktop/large screens only.
           On mobile/tablet (below lg) this is replaced by the fixed bottom tab bar below. -->
      <div v-if="activeTab !== 'home'" class="hidden lg:block fixed bottom-6 inset-x-0 z-40 pointer-events-none">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-start">
          <div class="pointer-events-auto flex items-center gap-3 flex-wrap">
            <button @click="switchTab('home')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'home' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="01. Welcome">
              <i data-lucide="home" class="h-5 w-5"></i>
            </button>
            <div class="w-1.5"></div>
            <button @click="switchTab('chef')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'chef' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="02. Profile">
              <i data-lucide="user" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('background')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'background' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="03. Background">
              <i data-lucide="route" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('menu')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'menu' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="04. Selected Works (Portofolio)">
              <i data-lucide="book-open" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('certificate')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'certificate' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="05. Certificates">
              <i data-lucide="badge-check" class="h-5 w-5"></i>
            </button>
            <div class="relative">
              <!-- click-outside overlay -->
              <div v-if="isContactMenuOpen" @click="isContactMenuOpen = false" class="fixed inset-0 z-30"></div>

              <!-- speed-dial social icons -->
              <transition name="fade">
                <div v-if="isContactMenuOpen" class="absolute bottom-full left-0 mb-3 flex flex-col items-center gap-3 z-40">
                  <a v-if="mainPageContent.linkedinUrl" :href="mainPageContent.linkedinUrl" target="_blank" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_16px_32px_-6px_rgba(0,0,0,0.14)] hover:-translate-y-1 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black" title="LinkedIn">
                    <i data-lucide="linkedin" class="h-5 w-5"></i>
                  </a>
                  <a v-if="chefProfileState.contactEmail" :href="'mailto:' + chefProfileState.contactEmail" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_16px_32px_-6px_rgba(0,0,0,0.14)] hover:-translate-y-1 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black" title="Email">
                    <i data-lucide="mail" class="h-5 w-5"></i>
                  </a>
                </div>
              </transition>

              <button @click="isContactMenuOpen = !isContactMenuOpen" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1 relative z-40', isContactMenuOpen ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="06. Let's Connect">
                <i data-lucide="contact" class="h-5 w-5"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- MOBILE / TABLET BOTTOM TAB BAR — replaces the floating dock below the
           lg breakpoint with a floating, neumorphic "timbul" bar (icon + label),
           same tabs/logic as the desktop dock above, just a different look.
           The bar itself is a raised white card, and every button inside it is
           its own raised shape that presses in (mendelep) on tap.
           Unlike the desktop dock, this stays visible on the beranda too, since
           the mobile home top bar no longer carries its own nav links. -->
      <div class="mobile-tab-bar lg:hidden fixed bottom-3 inset-x-3 z-40" style="bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));">
        <div class="flex items-stretch w-full gap-1.5">
          <button @click="switchTab('home')" :class="['mobile-tab-item', activeTab === 'home' ? 'mobile-tab-active' : '']">
            <i data-lucide="home" class="h-5 w-5"></i>
            <span>Home</span>
          </button>
          <button @click="switchTab('chef')" :class="['mobile-tab-item', activeTab === 'chef' ? 'mobile-tab-active' : '']">
            <i data-lucide="user" class="h-5 w-5"></i>
            <span>Profile</span>
          </button>
          <button @click="switchTab('background')" :class="['mobile-tab-item', activeTab === 'background' ? 'mobile-tab-active' : '']">
            <i data-lucide="route" class="h-5 w-5"></i>
            <span>Kisah</span>
          </button>
          <button @click="switchTab('menu')" :class="['mobile-tab-item', activeTab === 'menu' ? 'mobile-tab-active' : '']">
            <i data-lucide="book-open" class="h-5 w-5"></i>
            <span>Karya</span>
          </button>
          <button @click="switchTab('certificate')" :class="['mobile-tab-item', activeTab === 'certificate' ? 'mobile-tab-active' : '']">
            <i data-lucide="badge-check" class="h-5 w-5"></i>
            <span>Sertif.</span>
          </button>
          <div class="relative flex-1 flex">
            <!-- click-outside overlay -->
            <div v-if="isContactMenuOpen" @click="isContactMenuOpen = false" class="fixed inset-0 z-30"></div>

            <!-- speed-dial social icons — pops up above the bar -->
            <transition name="fade">
              <div v-if="isContactMenuOpen" class="absolute bottom-full right-2 mb-3 flex flex-col items-center gap-3 z-40">
                <a v-if="mainPageContent.linkedinUrl" :href="mainPageContent.linkedinUrl" target="_blank" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted" title="LinkedIn">
                  <i data-lucide="linkedin" class="h-5 w-5"></i>
                </a>
                <a v-if="chefProfileState.contactEmail" :href="'mailto:' + chefProfileState.contactEmail" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted" title="Email">
                  <i data-lucide="mail" class="h-5 w-5"></i>
                </a>
              </div>
            </transition>

            <button @click="isContactMenuOpen = !isContactMenuOpen" :class="['mobile-tab-item', isContactMenuOpen ? 'mobile-tab-active' : '']">
              <i data-lucide="contact" class="h-5 w-5"></i>
              <span>Kontak</span>
            </button>
          </div>
        </div>
      </div>

      <!-- spacer so page content isn't hidden behind the fixed mobile tab bar -->
      <div class="mobile-tab-bar-spacer lg:hidden"></div>


      <main class="w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 mt-2 lg:mt-4 pt-10 lg:pt-0">
        
        <!-- HOME PAGE -->
        <div v-if="activeTab === 'home'" class="flex flex-col gap-3 w-full items-center fade-in-up">

          <!-- HOME TOP BAR (only on beranda). On mobile/tablet (below lg) the
               Profile/Background/Portofolio/Sertifikat pill links are hidden —
               those pages are reached instead via the fixed bottom tab bar,
               so the mobile top bar shows just the title, centered. -->
          <div class="w-full grid grid-cols-[1fr_auto_1fr] lg:grid-cols-[1fr_auto_1fr] items-center gap-3 pb-2.5 mb-1 border-b border-neutral-200/70">
            <div class="hidden lg:flex items-center gap-6 sm:gap-10 text-[10px] sm:text-xs font-mono uppercase tracking-widest text-brand-muted justify-self-start">
              <button @click="switchTab('chef')" class="pill-press font-bold hover:text-black transition-colors cursor-pointer focus:outline-none">Profile</button>
              <button @click="switchTab('background')" class="pill-press font-bold hover:text-black transition-colors cursor-pointer focus:outline-none">Background</button>
            </div>

            <h1 @click="handleNameClick" class="hand-title text-center text-xl sm:text-2xl text-black select-none cursor-default justify-self-center col-start-1 col-end-4 lg:col-start-2 lg:col-end-3">
              {{ mainPageContent.title }}
            </h1>

            <div class="hidden lg:flex items-center gap-5 sm:gap-8 text-brand-muted justify-self-end">
              <div class="flex items-center gap-6 sm:gap-10">
                <button @click="switchTab('menu')" class="pill-press font-bold text-[10px] sm:text-xs font-mono tracking-widest hover:text-black transition-colors cursor-pointer focus:outline-none">Portofolio</button>
                <button @click="switchTab('certificate')" class="pill-press font-bold text-[10px] sm:text-xs font-mono tracking-widest hover:text-black transition-colors cursor-pointer focus:outline-none">Sertifikat</button>
              </div>
            </div>
          </div>

          <!-- TWO SEPARATE WHITE SHAPES, SIDE BY SIDE — makes use of the empty
               space on either side that used to just be cream background. -->
          <div class="w-full flex flex-col xl:flex-row gap-6 items-start">

          <!-- SHAPE 1: existing profile + portfolio highlight card -->
          <div ref="homeShapeLeftRef" class="flex-1 w-full py-6 md:py-8 px-6 md:px-10 bg-white rounded-[32px] border border-neutral-100/50 shadow-[0_15px_50px_rgba(0,0,0,0.03)] flex flex-col gap-2 relative">

            <!-- FLOATING SOCIAL BUTTONS — sits beside the white card on the cream background, scrolls with the card, never overlaps other content -->
            <div v-if="mainPageContent.linkedinUrl || chefProfileState.contactEmail"
                 class="hidden lg:flex absolute bottom-0 right-0 translate-x-[76px] xl:translate-x-[92px] z-20 flex-col items-center gap-2.5 bg-white/70 backdrop-blur-md border border-neutral-200/60 rounded-full py-4 px-2 shadow-[0_15px_35px_-8px_rgba(0,0,0,0.1)]">
              <a v-if="mainPageContent.linkedinUrl" :href="mainPageContent.linkedinUrl" target="_blank" title="LinkedIn" class="icon-social h-10 w-10 rounded-full bg-white border border-neutral-200/70 shadow-sm hover:shadow-md hover:-translate-y-0.5 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black">
                <i data-lucide="linkedin" class="h-4 w-4"></i>
              </a>
              <a v-if="chefProfileState.contactEmail" :href="'mailto:' + chefProfileState.contactEmail" title="Email" class="icon-social h-10 w-10 rounded-full bg-white border border-neutral-200/70 shadow-sm hover:shadow-md hover:-translate-y-0.5 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black">
                <i data-lucide="mail" class="h-4 w-4"></i>
              </a>
            </div>

            <div class="w-full flex flex-col lg:flex-row gap-6 lg:gap-10 items-start justify-between">
            <div class="flex-1 space-y-5 text-left">
              <div class="group h-32 w-32 md:h-40 md:w-40 rounded-full overflow-hidden bg-brand-bone shadow-sm flex items-center justify-center mb-1 transition-all duration-500 ease-out hover:shadow-[0_20px_40px_-10px_rgba(0,0,0,0.18)] hover:-translate-y-1 hover:-rotate-2 cursor-pointer">
                <img v-if="mainPageContent.photoUrl" :src="mainPageContent.photoUrl" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-110" />
                <i v-else data-lucide="user-round" class="h-9 w-9 text-brand-gold/50 transition-transform duration-500 group-hover:scale-110"></i>
              </div>
              <h1 @click="handleNameClick" class="text-2xl md:text-3xl name-title text-black tracking-tight font-medium select-none cursor-default">
                {{ mainPageContent.name }}
              </h1>
              <h2 class="text-lg md:text-xl font-sans font-semibold text-black leading-snug">
                {{ mainPageContent.slogan }}
              </h2>
              <p class="text-xs md:text-sm text-brand-muted leading-relaxed max-w-lg pt-1">
                {{ mainPageContent.body }}
              </p>
            </div>

            <!-- RIGHT SLIDER -->
            <div class="w-full lg:w-[390px] shrink-0 bg-brand-cream rounded-[40px] p-5 flex flex-col items-center border border-neutral-200/50 shadow-inner">
              <div class="w-full text-center mb-4 relative">
                <span class="text-[10px] font-mono tracking-widest text-neutral-400 uppercase font-bold">HIGHLIGHT PORTOFOLIO MENU</span>
                <div class="h-1 w-12 bg-neutral-300 mx-auto mt-2 rounded-full"></div>
              </div>

              <div class="w-full" v-if="currentDish">
                <div @click="openDishDetails(currentDish)" class="w-full bg-white rounded-[24px] p-3.5 shadow-[0_15px_35px_rgba(0,0,0,0.04)] hover:shadow-[0_25px_50px_rgba(0,0,0,0.08)] hover:-translate-y-1.5 transition-all duration-300 cursor-pointer select-none group border-none">
                  <div class="relative aspect-[16/11] rounded-xl overflow-hidden bg-neutral-100">
                    <img :src="currentDish.image" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                    <span class="absolute top-2.5 left-2.5 bg-white text-black border border-neutral-150 text-[8px] font-mono font-bold tracking-widest px-2 py-0.5 rounded-full uppercase shadow-sm">{{ currentDish.categoryLabel.split(" ")[0] }}</span>
                    <span class="absolute top-2.5 right-2.5 bg-white text-black border border-neutral-150 text-[8px] font-mono font-bold tracking-wider px-2 py-0.5 rounded-full shadow-sm">{{ currentDish.price }}</span>
                  </div>
                  <div class="pt-3 px-1 text-left">
                    <h3 class="text-lg font-serif text-black font-bold leading-tight group-hover:text-brand-gold transition-colors mb-1 line-clamp-1">{{ currentDish.name }}</h3>
                    <p class="text-[11px] text-neutral-500 leading-relaxed line-clamp-2 mb-3">{{ currentDish.shortDescription }}</p>
                    <hr class="border-neutral-100 mb-2.5" />
                    <div class="flex items-center gap-1.5 text-[10px] text-brand-gold-dark font-mono font-bold">
                      <i data-lucide="award" class="h-3 w-3"></i>
                      <span>{{ currentDish.impactMetric }}</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="flex items-center justify-between w-full mt-4 px-1">
                <button @click="handlePrevSlide" class="slider-nav-btn h-9 w-9 rounded-full bg-white border border-neutral-200/80 text-brand-muted flex items-center justify-center cursor-pointer focus:outline-none">
                  <i data-lucide="chevron-left" class="h-4 w-4"></i>
                </button>
                <div class="flex items-center gap-1.5">
                  <button v-for="(item, idx) in portfolioMenu" :key="idx" @click="currentSlideIndex = idx" :class="['transition-all duration-300 rounded-full', idx === currentSlideIndex ? 'w-5 h-1 bg-neutral-700' : 'w-1 h-1 bg-neutral-200']"></button>
                </div>
                <button @click="handleNextSlide" class="slider-nav-btn h-9 w-9 rounded-full bg-white border border-neutral-200/80 text-brand-muted flex items-center justify-center cursor-pointer focus:outline-none">
                  <i data-lucide="chevron-right" class="h-4 w-4"></i>
                </button>
              </div>
            </div>
          </div>
          </div>

          <!-- SHAPE 2: NEW — dedicated career timeline card. Outer shell is white
               "timbul" (matches SHAPE 1's card treatment), with an inner cream
               inset panel (matches the HIGHLIGHT PORTOFOLIO MENU slider look)
               wrapping the timeline itself.

               HEIGHT: on xl screens (side-by-side layout) this card's height is
               pinned in JS (homeCareerCardHeight, computed via ResizeObserver on
               SHAPE 1 — see app.js) to always exactly match SHAPE 1's own height,
               one-way only. This is intentional and NOT the same as self-stretch/
               items-stretch: a plain CSS stretch matches whichever sibling is

               because of career entries; if the list is longer than that pinned
               height, only the timeline scrolls internally (overflow-hidden +
               flex-1 min-h-0 below). Below xl (stacked layout) homeCareerCardHeight
               is null and the card just sizes to its natural content height. -->

                        </div>

                        <!-- IMPACT -->
                        <div class="space-y-2.5 p-3.5">
                          <h4 class="font-sans font-bold text-black text-sm flex items-center gap-2">
                            <i data-lucide="trending-up" class="h-4 w-4 text-brand-gold"></i>
                            Impact
                          </h4>
                          <ul class="space-y-2">
                            <li v-for="(res, i) in selectedDish.chefNotes.results" :key="i" class="flex items-start gap-2.5">
                              <span class="h-4.5 w-4.5 rounded-full bg-brand-cream text-brand-gold-dark flex items-center justify-center flex-shrink-0 mt-0.5 border border-neutral-300">
                                <i data-lucide="check" class="h-3 w-3 font-bold"></i>
                              </span>
                              <span class="font-sans text-brand-muted leading-relaxed text-sm">{{ res }}</span>
                            </li>
                          </ul>
                        </div>

                        <!-- KATA KUNCI / KEYWORDS -->
                        <div class="space-y-2 p-3.5">
                          <h4 class="font-sans font-bold text-black text-sm flex items-center gap-2">
                            <i data-lucide="tags" class="h-4 w-4 text-brand-gold"></i>
                            Kata Kunci / Keywords
                          </h4>
                          <div class="flex flex-wrap gap-1.5">
                            <span v-for="(ing, i) in selectedDish.ingredients" :key="i" class="font-mono bg-brand-cream text-black border border-neutral-300 px-2 py-0.5 rounded-full text-[10px] leading-relaxed whitespace-nowrap">
                              {{ ing }}
                            </span>
                          </div>
                        </div>

                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </transition>

      <!-- CERTIFICATE LIGHTBOX MODAL -->
      <transition name="fade">
        <div v-if="selectedCertificate" class="fixed inset-0 z-[80] flex items-center justify-center p-3 md:p-6 text-left">
          <div @click="selectedCertificate = null" class="absolute inset-0 bg-brand-charcoal/80 backdrop-blur-md cursor-pointer"></div>

          <div class="bg-white w-full max-w-3xl rounded-[24px] shadow-[0_30px_80px_-10px_rgba(139,130,115,0.35)] relative border border-neutral-300 z-10 max-h-[92vh] flex flex-col overflow-hidden">

            <button @click="selectedCertificate = null" class="absolute top-4 right-4 z-40 bg-brand-cream/90 text-black p-1.5 rounded-full shadow-md hover:bg-brand-bone hover:scale-105 transition-all cursor-pointer border border-neutral-300">
              <i data-lucide="x" class="h-3.5 w-3.5"></i>
            </button>

            <div class="flex-1 overflow-y-auto no-scrollbar">
              <!-- CERTIFICATE IMAGE -->
              <div class="relative aspect-[4/3] bg-brand-bone">
                <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-brand-gold/25">
                  <i data-lucide="badge-check" class="h-14 w-14"></i>
                  <span class="text-[10px] font-mono uppercase tracking-widest text-brand-muted/50">Sertifikat</span>
                </div>
                <img v-if="selectedCertificate.image" :src="selectedCertificate.image" :alt="selectedCertificate.title" @error="$event.target.style.display='none'"
                     class="absolute inset-0 w-full h-full object-contain" />
              </div>

              <!-- CERTIFICATE INFO -->
              <div class="p-6 md:p-8 space-y-4">
                <div>
                  <span class="text-xs font-mono tracking-widest text-brand-gold font-bold uppercase block mb-2">{{ selectedCertificate.category }}</span>
                  <h2 class="text-2xl md:text-3xl font-serif font-semibold text-black tracking-tight leading-tight">
                    {{ selectedCertificate.title }}
                  </h2>
                  <p class="text-sm text-brand-muted mt-2">{{ selectedCertificate.issuer }}</p>
                </div>

                <div class="border border-neutral-200 rounded-2xl divide-y divide-neutral-200 overflow-hidden">
                  <div class="flex items-center justify-between px-4 py-3">
                    <span class="text-xs text-brand-muted flex items-center gap-2"><i data-lucide="calendar" class="h-3.5 w-3.5 text-brand-gold"></i>Tanggal Terbit</span>
                    <span class="text-xs font-mono font-bold text-black">{{ selectedCertificate.date }}</span>
                  </div>
                  <div v-if="selectedCertificate.credentialId" class="flex items-center justify-between px-4 py-3">
                    <span class="text-xs text-brand-muted flex items-center gap-2"><i data-lucide="hash" class="h-3.5 w-3.5 text-brand-gold"></i>ID Kredensial</span>
                    <span class="text-xs font-mono font-bold text-black">{{ selectedCertificate.credentialId }}</span>
                  </div>
                </div>

                <a v-if="selectedCertificate.credentialUrl" :href="selectedCertificate.credentialUrl" target="_blank"
                   class="inline-flex items-center gap-2 text-xs font-mono font-bold text-black bg-white border border-neutral-150 px-4 py-2.5 rounded-full hover:bg-brand-gold-dark transition-colors">
                  Verifikasi Kredensial <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </transition>

      <!-- IMAGE CROP MODAL — muncul sebelum foto manapun di admin panel diupload,
           biar bisa digeser/diperbesar/dipilih bagian mana yg mau dipakai. -->
      <transition name="fade">
        <div v-if="cropModalOpen" class="fixed inset-0 z-[95] flex items-center justify-center p-4">
          <div @click="closeCropModal" class="absolute inset-0 bg-brand-charcoal/80 backdrop-blur-sm cursor-pointer"></div>
          <div class="bg-white w-full max-w-lg rounded-3xl p-6 relative shadow-2xl z-10 text-left border border-neutral-200">
            <button type="button" @click="closeCropModal" class="absolute top-4 right-4 h-8 w-8 rounded-full hover:bg-neutral-100 flex items-center justify-center text-brand-muted cursor-pointer">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
            <h3 class="font-sans text-lg font-bold text-black mb-1">Atur Foto</h3>
            <p class="text-xs text-brand-muted mb-4">Geser dan perbesar untuk memilih bagian foto yang mau ditampilkan.</p>

            <div class="w-full h-72 bg-neutral-100 rounded-2xl overflow-hidden">
              <img id="cropperImage" :src="cropImageUrl" class="max-w-full block" />
            </div>

            <div class="flex items-center gap-3 mt-4">
              <button type="button" @click="cropZoomStep(-0.1)" class="nav-raised h-9 w-9 rounded-full bg-white flex items-center justify-center text-black cursor-pointer shrink-0">
                <i data-lucide="zoom-out" class="h-4 w-4"></i>
              </button>
              <input type="range" min="0" max="3" step="0.01" v-model.number="cropZoomValue" @input="setCropZoom" class="flex-1 accent-brand-gold-dark cursor-pointer" />
              <button type="button" @click="cropZoomStep(0.1)" class="nav-raised h-9 w-9 rounded-full bg-white flex items-center justify-center text-black cursor-pointer shrink-0">
                <i data-lucide="zoom-in" class="h-4 w-4"></i>
              </button>
            </div>

            <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-neutral-100">
              <button type="button" @click="closeCropModal" class="chip-raised px-4 py-2 rounded-xl text-black text-xs font-sans font-semibold cursor-pointer">Batal</button>
              <button type="button" @click="confirmCrop" class="btn-raised px-6 py-2 rounded-xl text-black text-xs font-sans font-semibold uppercase cursor-pointer">Gunakan Foto</button>
            </div>
          </div>
        </div>
      </transition>

      <!-- LOGIN MODAL -->
      <transition name="fade">
        <div v-if="isLoginModalOpen" class="fixed inset-0 z-[80] flex items-center justify-center p-4">
          <div @click="isLoginModalOpen = false" class="absolute inset-0 bg-brand-charcoal/70 backdrop-blur-sm cursor-pointer"></div>
          <div class="bg-brand-cream w-full max-w-md rounded-3xl p-6 relative shadow-2xl z-10 text-left border border-neutral-200">
            <button @click="isLoginModalOpen = false" class="absolute top-4 right-4 h-8 w-8 rounded-full hover:bg-neutral-100 flex items-center justify-center text-brand-muted">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
            <div class="text-center space-y-2 mb-6">
              <div class="h-12 w-12 rounded-full bg-neutral-100 flex items-center justify-center mx-auto text-black">
                <i data-lucide="lock" class="h-5 w-5"></i>
              </div>
              <h3 class="font-sans text-xl font-bold">Private Archive Login</h3>
            </div>
            <form @submit.prevent="handleLogin" class="space-y-4">
              <input type="password" v-model="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl focus:outline-none" />
              <div v-if="loginError" class="bg-red-50 text-red-800 text-xs p-3 rounded-xl">{{loginError}}</div>
              <button type="submit" class="btn-raised w-full py-2.5 text-black rounded-xl font-sans font-semibold uppercase text-xs">Masuk</button>
            </form>
          </div>
        </div>
      </transition>
      </transition>
      </template>
    </div>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>

    <!-- Init App -->
    <script src="app.js"></script>
    <style>
      .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
      .fade-enter-from, .fade-leave-to { opacity: 0; }
      /* Selaraskan header "Review Pelanggan" dengan header "Tulis Ulasan Anda"
         (kartu kiri punya padding 1.5rem sebelum kontennya, kolom kanan perlu offset yang sama) */
      @media (min-width: 768px) {
        .guestbook-right-col { padding-top: 1.5rem; }
      }
    </style>
  </body>
</html>
