<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nadyanah-Portfolio</title>
    <script>
      // NOTE: pakai createElement + appendChild (bukan document.body.innerHTML +=)
      // karena innerHTML += me-reparse SELURUH isi <body>, yang menghancurkan
      // node-node yang sedang dipegang Vue/Cropper.js/lucide. Efeknya: satu error
      // kecil bisa memicu error susulan "insertBefore"/"appendChild of null" karena
      // referensi DOM lama sudah tidak valid — bikin halaman ikut rusak/putih.
      function showDebugOverlay(html, topOffset) {
        const el = document.createElement('div');
        el.style.cssText = 'color:red; background:white; position:fixed; top:' + topOffset + 'px; left:0; right:0; z-index:99999; padding:20px; border-bottom:2px solid red;';
        el.innerHTML = html;
        document.body.appendChild(el);
      }
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        // "ResizeObserver loop completed/limit exceeded" is a harmless
        // browser-level notice (every major browser fires it), not a real
        // bug — it just means a resize observer's callback triggered
        // another resize in the same frame, so the browser deferred it.
        // All major frameworks (Vue CLI, CRA, Next.js, etc.) filter this
        // exact message out of their error overlays for the same reason.
        if (typeof msg === "string" && msg.indexOf("ResizeObserver loop") !== -1) {
          return false;
        }
        showDebugOverlay('<strong>ERROR:</strong> ' + msg + '<br>' + url + ' (line ' + lineNo + ')<br><pre>' + (error && error.stack ? error.stack : '') + '</pre>', 0);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        showDebugOverlay('<strong>PROMISE REJECTION:</strong> ' + event.reason, 50);
      });
    </script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons (CDN) — pinned to 0.561.0. Lucide v1.0+ removed all brand/social icons
         (facebook, instagram, twitter, linkedin, github, dribbble, etc), which this site still
         uses for social links. Do not bump to @latest without swapping those icons out first. -->    <script src="https://unpkg.com/lucide@0.561.0"></script>
    <!-- Tailwind CSS (compiled locally) -->
    <!--
      STYLING — how this project is set up now
      =========================================
      Tailwind used to be pre-compiled into a giant style.css file. The
      problem with that: any new Tailwind class you added to this HTML
      later had no matching CSS, because nothing was regenerating the
      stylesheet. That's fixed by loading Tailwind here as a normal
      <script> instead: it watches the page and generates styles for
      whatever classes it finds, live, no build step required. You can
      still open this file directly by double-clicking it — it just also
      needs an internet connection so the browser can fetch this script
      and the Google Font below.

      Brand colors/fonts are defined once in custom.css and wired into
      Tailwind via the config below, so "bg-brand-gold", "font-serif" etc.
      keep working exactly like before.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-cream': '#FCFAF7',
              'brand-bone': '#F4EFE6',
              'brand-charcoal': '#2C2825',
              'brand-gold': '#A07850',
              'brand-gold-dark': '#7A5C38',
              'brand-muted': '#8E877B',
              neutral: { 150: '#F0EEEB' },
            },
            fontFamily: {
              sans: ['var(--font-sans)'],
              serif: ['var(--font-serif)'],
              mono: ['var(--font-mono)'],
              hand: ['var(--font-hand)'],
            },
          },
        },
      };
    </script>
    <!-- Everything Tailwind can't do (fonts, brand color variables, the
         drawer, small animations) lives in this plain, hand-editable file. -->
    <link rel="stylesheet" href="custom.css" />
    <!-- Cropper.js: powers the "atur foto" crop/pan/zoom modal before any admin photo upload -->
    <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css" />
    <script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <!-- Data Configuration -->
    <script src="data.js"></script>
  </head>
  <body class="bg-brand-cream text-black font-sans relative">
    <div id="root" >
      <div v-if="dataLoading" class="min-h-screen flex items-center justify-center text-black font-mono text-sm tracking-widest uppercase">
        Memuat menu...
      </div>
      <div v-else-if="dataLoadError" class="min-h-screen flex items-center justify-center text-center px-6 text-red-600 font-mono text-sm max-w-md mx-auto">
        {{ dataLoadError }}
      </div>
      <template v-else>
      <!-- WELCOME / GREETING SCREEN — shown every time the site loads.
           Background is translucent (bg-brand-cream/85 + blur-sm) on
           purpose, same on mobile and desktop, so the dotted brand pattern
           behind it peeks through just a little instead of hiding it
           completely. Click/tap anywhere to dismiss. -->
      <transition name="fade">
        <div v-if="showWelcome" @click="showWelcome = false"
             class="fixed inset-0 z-[100] bg-brand-cream/85 backdrop-blur-sm flex flex-col items-center justify-center px-6 text-center cursor-pointer select-none">
          <div class="max-w-xl mx-auto px-2">
            <p class="font-hack font-semibold text-sm sm:text-base leading-relaxed sm:leading-normal text-black rich-text-content" v-html="mainPageContent.welcomeQuote"></p>
            <p v-if="mainPageContent.alertMessage" class="font-sans italic font-normal text-[11px] sm:text-sm leading-snug text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-2.5 mt-6 sm:mt-5 inline-block" style="white-space: pre-line;">
              ⚠️ {{ mainPageContent.alertMessage }}
            </p>
          </div>

          <div class="absolute bottom-10 left-8 sm:left-14 flex flex-col items-start gap-1.5">
            <!-- growing plant / sprout — clean, symmetric line drawing, animates growing in
                 stroke-by-stroke (stem → leaves) then idles with a
                 gentle sway once fully grown -->
            <svg viewBox="0 0 100 100" class="h-28 w-28 sm:h-32 sm:w-32 text-black plant-grow" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path class="plant-path plant-path-stem" d="M50 94 C47 79 54 65 49 50 C45 38 52 27 47 12" />
              <path class="plant-path plant-path-leaf1" d="M50 61 C39 57 33 60 29 50 C39.5 46 49 50.5 50 61 Z" />
              <path class="plant-path plant-path-leaf2" d="M48 43 C59 39 65 29 61 20 C51 24.5 45.5 33 48 43 Z" />
              <path class="plant-path plant-path-leaf3" d="M47 25 C40 21.5 38 15 41 9 C47.5 12 50 18.5 47 25 Z" />
            </svg>
          </div>

          <p class="absolute bottom-10 right-6 sm:right-8 text-[10px] sm:text-xs font-mono uppercase tracking-widest text-brand-muted/70">{{ mainPageContent.welcomeCta }}</p>
        </div>
      </transition>

      <!-- DEKORASI PARALLAX BACKGROUND -->
      <div class="absolute inset-0 opacity-[0.02] pointer-events-none" 
           style="background-image: radial-gradient(var(--color-brand-charcoal) 1px, transparent 0), radial-gradient(var(--color-brand-charcoal) 1px, transparent 0); background-size: 24px 24px; background-position: 0 0, 12px 12px"></div>
      
      <!-- GLOBAL PERSISTENT FLOATING NAVIGATION DOCK — desktop/large screens only.
           On mobile/tablet (below lg) this is replaced by the fixed bottom tab bar below. -->
      <div v-if="activeTab !== 'home'" class="hidden lg:block fixed bottom-6 inset-x-0 z-40 pointer-events-none">
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-start">
          <div class="pointer-events-auto flex items-center gap-3 flex-wrap">
            <button @click="switchTab('home')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'home' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="01. Welcome">
              <i data-lucide="home" class="h-5 w-5"></i>
            </button>
            <div class="w-1.5"></div>
            <button @click="switchTab('chef')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'chef' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="02. Profile">
              <i data-lucide="user" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('background')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'background' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="03. Background">
              <i data-lucide="route" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('menu')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'menu' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="04. Selected Works (Portfolio)">
              <i data-lucide="book-open" class="h-5 w-5"></i>
            </button>
            <button @click="switchTab('certificate')" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1', activeTab === 'certificate' ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="05. Credentials & Publications">
              <i data-lucide="badge-check" class="h-5 w-5"></i>
            </button>
            <div class="w-1.5"></div>
            <button @click="copyLink" :title="linkCopied ? 'Page link copied!' : 'Copy link to this page'" class="nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1 border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300">
              <i :data-lucide="linkCopied ? 'check' : 'link'" class="h-5 w-5"></i>
            </button>
            <div class="relative">
              <!-- click-outside overlay -->
              <div v-if="isContactMenuOpen" @click="isContactMenuOpen = false" class="fixed inset-0 z-30"></div>

              <!-- speed-dial social icons -->
              <transition name="popup-fade">
                <div v-if="isContactMenuOpen" class="absolute bottom-full left-0 mb-3 flex flex-col items-center gap-3 z-40">
                  <a v-if="mainPageContent.linkedinUrl" :href="mainPageContent.linkedinUrl" target="_blank" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_16px_32px_-6px_rgba(0,0,0,0.14)] hover:-translate-y-1 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black" title="LinkedIn">
                    <i data-lucide="linkedin" class="h-5 w-5"></i>
                  </a>
                  <a v-if="chefProfileState.contactEmail" :href="'mailto:' + chefProfileState.contactEmail" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_16px_32px_-6px_rgba(0,0,0,0.14)] hover:-translate-y-1 flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted hover:text-black" title="Email">
                    <i data-lucide="mail" class="h-5 w-5"></i>
                  </a>
                </div>
              </transition>

              <button @click="isContactMenuOpen = !isContactMenuOpen" :class="['nav-raised h-11 w-11 rounded-full bg-white flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 focus:outline-none hover:-translate-y-1 relative z-40', isContactMenuOpen ? 'nav-active border border-[#e7e2dc] text-neutral-500' : 'border border-neutral-200/60 text-neutral-500 hover:text-black hover:border-neutral-300']" title="06. Let's Connect">
                <i data-lucide="contact" class="h-5 w-5"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- MOBILE VISITOR COUNTER (beranda only) — replaces the copy-link button
           below with just the visitor count as a plain number while on the
           home tab. Same fixed top-right spot, no icon this time. -->
      <div v-if="!showWelcome && activeTab === 'home' && visitorCount > 0"
           title="Total number of visitors"
           class="lg:hidden fixed top-3 right-3 z-40 h-10 min-w-10 px-3 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] hover:shadow-[0_16px_32px_-6px_rgba(0,0,0,0.14)] hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center text-black text-sm font-mono font-bold select-none">
        {{ visitorCount.toLocaleString('en-US') }}
      </div>

      <!-- MOBILE COPY-LINK BUTTON — small fixed button, top-right. The bottom
           tab bar is already full (Home/Profile/Kisah/Karya/Sertif/Kontak),
           so this sits on its own instead of becoming a cramped 7th item.
           Same idea as the desktop dock's link button: copies a shareable
           link to whatever page/popup is currently open. On the beranda
           this button is swapped out for the visitor counter above instead. -->
      <button v-if="!showWelcome && activeTab !== 'admin' && activeTab !== 'home'" @click="copyLink" :title="linkCopied ? 'Page link copied!' : 'Copy link to this page'" class="lg:hidden fixed top-3 right-3 z-40 h-10 w-10 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] flex items-center justify-center text-neutral-500 active:scale-95 transition-all">
        <i :data-lucide="linkCopied ? 'check' : 'link'" class="h-4 w-4"></i>
      </button>

      <!-- MOBILE / TABLET BOTTOM TAB BAR — replaces the floating dock below the
           lg breakpoint with a floating, neumorphic "timbul" bar (icon + label),
           same tabs/logic as the desktop dock above, just a different look.
           The bar itself is a raised white card, and every button inside it is
           its own raised shape that presses in (mendelep) on tap.
           Unlike the desktop dock, this stays visible on the beranda too, since
           the mobile home top bar no longer carries its own nav links. -->
      <div class="mobile-tab-bar lg:hidden fixed bottom-3 inset-x-3 z-40" style="bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));">
        <div class="flex items-stretch w-full gap-1.5">
          <button @click="switchTab('home')" :class="['mobile-tab-item', activeTab === 'home' ? 'mobile-tab-active' : '']">
            <i data-lucide="home" class="h-5 w-5"></i>
            <span>Home</span>
          </button>
          <button @click="switchTab('chef')" :class="['mobile-tab-item', activeTab === 'chef' ? 'mobile-tab-active' : '']">
            <i data-lucide="user" class="h-5 w-5"></i>
            <span>Profile</span>
          </button>
          <button @click="switchTab('background')" :class="['mobile-tab-item', activeTab === 'background' ? 'mobile-tab-active' : '']">
            <i data-lucide="route" class="h-5 w-5"></i>
            <span>Story</span>
          </button>
          <button @click="switchTab('menu')" :class="['mobile-tab-item', activeTab === 'menu' ? 'mobile-tab-active' : '']">
            <i data-lucide="book-open" class="h-5 w-5"></i>
            <span>Work</span>
          </button>
          <button @click="switchTab('certificate')" :class="['mobile-tab-item', activeTab === 'certificate' ? 'mobile-tab-active' : '']">
            <i data-lucide="badge-check" class="h-5 w-5"></i>
            <span>Creds.</span>
          </button>
          <div class="relative flex-1 flex">
            <!-- click-outside overlay -->
            <div v-if="isContactMenuOpen" @click="isContactMenuOpen = false" class="fixed inset-0 z-30"></div>

            <!-- speed-dial social icons — pops up above the bar -->
            <transition name="popup-fade">
              <div v-if="isContactMenuOpen" class="absolute bottom-full right-2 mb-3 flex flex-col items-center gap-3 z-40">
                <a v-if="mainPageContent.linkedinUrl" :href="mainPageContent.linkedinUrl" target="_blank" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted" title="LinkedIn">
                  <i data-lucide="linkedin" class="h-5 w-5"></i>
                </a>
                <a v-if="chefProfileState.contactEmail" :href="'mailto:' + chefProfileState.contactEmail" class="icon-social h-11 w-11 rounded-full bg-white border border-neutral-200/60 shadow-[0_10px_25px_-4px_rgba(0,0,0,0.08),0_4px_12px_-2px_rgba(0,0,0,0.04)] flex items-center justify-center transition-all duration-300 cursor-pointer active:scale-95 text-brand-muted" title="Email">
                  <i data-lucide="mail" class="h-5 w-5"></i>
                </a>
              </div>
            </transition>

            <button @click="isContactMenuOpen = !isContactMenuOpen" :class="['mobile-tab-item', isContactMenuOpen ? 'mobile-tab-active' : '']">
              <i data-lucide="contact" class="h-5 w-5"></i>
              <span>Contact</span>
            </button>
          </div>
        </div>
      </div>

      <main class="w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 mt-2 lg:mt-4 pt-10 lg:pt-0">
        
        <!-- HOME PAGE -->
        <div v-if="activeTab === 'home'" class="flex flex-col gap-3 w-full items-center fade-in-up">

          <!-- HOME TOP BAR (only on beranda). On mobile/tablet (below lg) the
               Profile/Background/Portofolio/Sertifikat pill links are hidden —
               those pages are reached instead via the fixed bottom tab bar,
               so the mobile top bar shows just the title, centered. -->
          <div class="w-full grid grid-cols-[1fr_auto_1fr] lg:grid-cols-[1fr_auto_1fr] items-center gap-3 pb-2.5 mb-1 border-b border-neutral-200/70">
            <div class="hidden lg:flex items-center gap-6 sm:gap-10 text-[10px] sm:text-xs font-mono uppercase tracking-widest text-brand-muted justify-self-start">
              <button @click="switchTab('chef')" class="pill-press font-bold hover:text-black transition-colors cursor-pointer focus:outline-none">Profile</button>
              <button @click="switchTab('background')" class="pill-press font-bold hover:text-black transition-colors cursor-pointer focus:outline-none">Background</button>
            </div>

            <h1 @click="handleNameClick" class="hand-title text-center text-xl sm:text-2xl text-black select-none cursor-default justify-self-center col-start-1 col-end-4 lg:col-start-2 lg:col-end-3">
              {{ mainPageContent.title }}
            </h1>

            <div class="hidden lg:flex items-center gap-5 sm:gap-8 text-brand-muted justify-self-end">
              <div class="flex items-center gap-6 sm:gap-10">
                <button @click="switchTab('menu')" class="pill-press font-bold text-[10px] sm:text-xs font-mono tracking-widest hover:text-black transition-colors cursor-pointer focus:outline-none">Portfolio</button>
                <button @click="switchTab('certificate')" class="pill-press font-bold text-[10px] sm:text-xs font-mono tracking-widest hover:text-black transition-colors cursor-pointer focus:outline-none">Credentials</button>
              </div>
              <!-- VISITOR COUNTER (desktop, beranda) — dulu tombol "salin link", sekarang
                   diganti tampilkan jumlah pengunjung sebagai angka polos saja (lihat
                   trackVisitor() di app.js). Bentuknya cuma angka, tanpa icon. -->
              <div v-if="visitorCount > 0" title="Total number of visitors"
                   class="h-8 min-w-8 px-3 rounded-full bg-white border border-neutral-200/60 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center text-black text-xs sm:text-sm font-mono font-bold select-none">
                {{ visitorCount.toLocaleString('en-US') }}
              </div>
            </div>
          </div>

          <!-- TWO SEPARATE WHITE SHAPES, SIDE BY SIDE — makes use of the empty
               space on either side that used to just be cream background. -->
          <div class="w-full flex flex-col xl:flex-row gap-6 items-start">

          <!-- SHAPE 1: existing profile + portfolio highlight card -->
          <div ref="homeShapeLeftRef" class="flex-1 w-full py-6 md:py-8 px-6 md:px-10 bg-white rounded-[32px] border border-neutral-200/60 shadow-sm flex flex-col gap-2 relative">

            <div class="w-full flex flex-col lg:flex-row gap-6 lg:gap-10 items-center lg:items-start justify-between">
            <div class="flex-1 flex flex-col items-center text-center lg:items-start lg:text-left">
              <div @click="switchTab('chef')" class="group h-32 w-32 md:h-40 md:w-40 rounded-full overflow-hidden bg-brand-bone shadow-sm flex items-center justify-center mb-4 transition-all duration-500 ease-out hover:shadow-[0_20px_40px_-10px_rgba(0,0,0,0.18)] hover:-translate-y-1 hover:-rotate-2 cursor-pointer">
                <img v-if="mainPageContent.photoUrl" :src="mainPageContent.photoUrl" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-110" />
                <i v-else data-lucide="user-round" class="h-9 w-9 text-brand-gold/50 transition-transform duration-500 group-hover:scale-110"></i>
              </div>
              <h1 class="text-2xl md:text-3xl name-title text-black tracking-tight font-medium select-none cursor-default">
                {{ mainPageContent.name }}
              </h1>
              <h2 class="text-sm md:text-base font-sans font-semibold text-black leading-snug mt-2 rich-text-content" v-html="mainPageContent.slogan">
              </h2>
              <p class="text-xs md:text-sm text-brand-muted leading-relaxed max-w-lg mt-3 rich-text-content" v-html="mainPageContent.body"></p>
            </div>

            <!-- RIGHT SLIDER — wrapper ini menampung box cream (slider) + social buttons
                 di bawahnya. Social buttons sengaja diletakkan DI LUAR box cream (jadi
                 nempel di background putih Shape 1), tapi tetap satu kolom & sejajar
                 posisi (rata kiri, pas di bawah panah kiri). -->
            <div class="w-full lg:w-[390px] shrink-0 flex flex-col items-center lg:items-end gap-4">
            <div class="w-full bg-brand-cream rounded-[40px] p-5 flex flex-col items-center border border-neutral-200/50 shadow-inner">
              <div class="w-full text-center mb-4 relative">
                <span class="text-[10px] font-mono tracking-widest text-neutral-400 uppercase font-bold">Explore My Work 🌿</span>
                <div class="h-1 w-12 bg-neutral-300 mx-auto mt-2 rounded-full"></div>
              </div>

              <div class="w-full" v-if="currentDish">
                <div @click="openDishDetails(currentDish)" class="w-full bg-white rounded-[24px] p-3.5 shadow-[0_15px_35px_rgba(0,0,0,0.04)] hover:shadow-[0_25px_50px_rgba(0,0,0,0.08)] hover:-translate-y-1.5 transition-all duration-300 cursor-pointer select-none group border-none">

                  </template>

                       Skills) paling bawah. Urutan mengikuti urutan section di data/admin. -->

                        <h3 class="font-serif text-lg font-medium text-black flex items-center gap-2 border-b border-brand-bone pb-2 mb-3">
                          <i :data-lucide="sectionIcon(section.type)" class="h-4 w-4 text-brand-gold"></i> {{section.title}}
                        </h3>
                        <!-- Entri di section "experience" yang di-uncheck "Tampilkan di Beranda"
                             juga disembunyikan di sini (bagian Professional Experience halaman
                             Profil/CV) — hanya halaman Background yang selalu menampilkan semua
                             entri apa adanya, tidak peduli status showOnHome. -->
                        <div v-if="!section.entries || !section.entries.filter(e => e.showOnHome !== false).length" class="text-xs text-brand-muted italic">

                </div>

                <button v-for="cat in certificateCategories" :key="'certcat-'+cat" @click="selectedCertificateCategory = cat"

                        class="w-full px-4 py-3 bg-neutral-50/50 border border-neutral-200/60 rounded-xl focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold/30 text-sm transition-all placeholder:text-neutral-300" />
                    </div>

                    <!-- Hidangan Favorit -->

                      <label class="block text-[10px] font-bold text-brand-muted mb-1.5 tracking-wider uppercase">Favorite Project</label>

                          <option v-for="item in portfolioMenu" :key="item.id" :value="item.name">{{item.name}}</option>
                        </select>

                        </div>

                            <label class="chip-raised px-3 py-1.5 text-black rounded-full text-[11px] font-semibold cursor-pointer hover:text-brand-gold-dark transition-all w-fit">
                              {{ homepagePhotoUploading ? 'Mengupload...' : 'Pilih Foto' }}
                              <input type="file" accept="image/*" :disabled="homepagePhotoUploading" @change="handleHomepagePhotoUpload" class="hidden" />
                            </label>
                            <button type="button" v-if="homepageForm.photoUrl" @click="handleHomepagePhotoRemove" class="text-[11px] text-red-500 hover:text-red-600 font-semibold text-left cursor-pointer">Hapus Foto</button>
                          </div>
                        </div>
                        <p class="text-[10px] text-brand-muted mt-1">Foto akan otomatis dipotong bulat, jangan lupa klik Simpan setelah memilih.</p>
                      </div>
                      <div class="space-y-1">
                        <label class="text-sm font-bold text-black">Nama / Brand Tampilan*</label>
                        <input type="text" required v-model="homepageForm.name" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none" />
                      </div>
                      <div class="space-y-1">
                        <label class="text-sm font-bold text-black">Judul Samping Atas*</label>
                        <input type="text" required v-model="homepageForm.title" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none" />
                      </div>
                      <div class="space-y-1 md:col-span-2">
                        <label class="text-sm font-bold text-black">Kalimat Slogan Utama (Headline)*</label>
                        <rich-text-editor v-model="homepageForm.slogan" placeholder="Slogan utama yang tampil di beranda..." :min-rows="1.2"></rich-text-editor>
                      </div>
                      <div class="space-y-1 md:col-span-2">
                        <label class="text-sm font-bold text-black">Paragraf Deskripsi Beranda*</label>
                        <rich-text-editor v-model="homepageForm.body" placeholder="Deskripsi singkat tentang dirimu di beranda..." :min-rows="4"></rich-text-editor>
                      </div>
                      <div class="space-y-1 md:col-span-2 border-t border-neutral-100 pt-3">
                        <label class="text-sm font-bold text-black block">Kalimat Layar Sambutan (Welcome Screen)*</label>
                        <p class="text-[10px] text-brand-muted mb-1">Ini kalimat yang muncul pertama kali saat website dibuka. Tekan Enter di posisi yang kamu mau untuk mengatur baris barunya sendiri.</p>
                        <rich-text-editor v-model="homepageForm.welcomeQuote" placeholder="Kalimat sambutan..." :min-rows="5"></rich-text-editor>
                      </div>
                      <div class="space-y-1 md:col-span-2">
                        <label class="text-sm font-bold text-black block">Teks Ajakan di Pojok Welcome Screen*</label>
                        <input type="text" required v-model="homepageForm.welcomeCta" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none" placeholder="[ Step inside the garden of growth → ]" />
                      </div>
                      <div class="space-y-1 md:col-span-2 border-t border-neutral-100 pt-3">
                        <label class="text-sm font-bold text-red-600 block">Alert / Pengumuman di Welcome Screen (opsional)</label>
                        <p class="text-[10px] text-brand-muted mb-1">Muncul sebagai kalimat berwarna merah di layar sambutan, contoh untuk memberi tahu pengunjung kalau web sedang dalam tahap development/update. Kosongkan kalau tidak ingin menampilkan alert apapun.</p>
                        <textarea rows="2" v-model="homepageForm.alertMessage" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none resize-none leading-relaxed" placeholder="Contoh: Website sedang dalam tahap pengembangan, beberapa bagian mungkin belum tampil sempurna."></textarea>
                      </div>
                      <div class="space-y-1 md:col-span-2 border-t border-neutral-100 pt-3">
                        <label class="text-sm font-bold text-black block">Jargon Pendek Versi Mobile (Quote Box)*</label>
                        <textarea required rows="2.5" v-model="homepageForm.mobileQuote" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none resize-none leading-relaxed"></textarea>
                      </div>
                      <div class="space-y-1 md:col-span-2">
                        <label class="text-sm font-bold text-black block">Deskripsi Pendek Laci Samping (Drawer Sidebar Description)*</label>
                        <textarea required rows="2.5" v-model="homepageForm.drawerDesc" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none resize-none leading-relaxed"></textarea>
                      </div>

                      <div class="md:col-span-2 border-t border-neutral-100 pt-3 mt-2">
                        <h4 class="font-bold text-black font-sans text-xs mb-3">Link Media Sosial &amp; Kontak</h4>
                      </div>
                      <div class="space-y-1">
                        <label class="text-sm font-bold text-black">LinkedIn URL</label>
                        <input type="url" v-model="homepageForm.linkedinUrl" class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none" placeholder="https://linkedin.com/in/username" />
                      </div>
                      <div class="space-y-1">
                        <label class="text-sm font-bold text-black">Email (dari data Profil)</label>
                        <input type="text" disabled :value="chefForm.contactEmail" class="w-full px-3 py-2 bg-neutral-100 border border-neutral-200 rounded-xl text-brand-muted cursor-not-allowed" />
                        <p class="text-[11px] text-brand-muted">Ubah email di tab Profil &rarr; field Email.</p>
                      </div>
                    </div>
                    <div class="border-t border-neutral-100 pt-4 flex justify-end">
                      <button type="submit" class="px-6 py-2.5 bg-white text-black border border-neutral-150 hover:bg-brand-gold-dark rounded-xl font-semibold uppercase tracking-wider text-xs cursor-pointer shadow-md transition-all active:scale-[0.98]">
                        Simpan Konten Beranda
                      </button>
                    </div>
                  </form>
                </div>

                <div v-else-if="adminTab === 'background'">
                  <!-- HIGHLIGHT PORTOFOLIO MENU (kartu di halaman Background) —
                       tab admin terpisah dari Halaman Utama, foto + 1 deskripsi saja. -->
                  <form @submit.prevent="handleBackgroundHighlightSubmit" class="space-y-6">
                    <div class="border-b border-neutral-100 pb-3">
                      <h3 class="text-lg font-sans font-bold text-black">Highlight Portofolio Menu (Halaman Background)</h3>
                      <p class="text-xs text-brand-muted mt-0.5">Foto dan 3 section deskripsi (WHY / HOW / WHAT) yang tampil di kartu HIGHLIGHT PORTOFOLIO MENU pada halaman Background.</p>
                    </div>

                    <div class="grid grid-cols-1 gap-4 text-xs">
                      <div class="space-y-1">
                        <label class="text-sm font-bold text-black block">Foto Highlight</label>
                        <div class="flex items-center gap-4">
                          <div class="h-16 w-24 rounded-xl overflow-hidden bg-brand-bone border border-neutral-200 shrink-0 flex items-center justify-center">
                            <img v-if="backgroundHighlightForm.image" :src="backgroundHighlightForm.image" class="w-full h-full object-cover" />
                            <i v-else data-lucide="image" class="h-5 w-5 text-brand-muted"></i>
                          </div>
                          <div class="flex flex-col gap-1.5">
                            <label class="chip-raised px-3 py-1.5 text-black rounded-full text-[11px] font-semibold cursor-pointer hover:text-brand-gold-dark transition-all w-fit">
                              {{ backgroundHighlightImageUploading ? 'Mengupload...' : 'Pilih Foto' }}
                              <input type="file" accept="image/*" :disabled="backgroundHighlightImageUploading" @change="handleBackgroundHighlightPhotoUpload" class="hidden" />
                            </label>
                            <button type="button" v-if="backgroundHighlightForm.image" @click="handleBackgroundHighlightPhotoRemove" class="text-[11px] text-red-500 hover:text-red-600 font-semibold text-left cursor-pointer">Hapus Foto</button>
                          </div>
                        </div>
                        <p class="text-[10px] text-brand-muted mt-1">Rasio foto 4:5, jangan lupa klik Simpan setelah memilih.</p>
                      </div>

                      <div v-for="(section, idx) in backgroundHighlightForm.sections" :key="idx" class="space-y-2 border border-neutral-100 rounded-xl p-3">
                        <div class="flex items-center gap-2">
                          <span class="shrink-0 px-2 py-1 rounded-md bg-brand-bone text-brand-gold-dark font-mono font-bold text-[10px] tracking-widest">[ {{ section.label }} ]</span>
                          <input v-model="section.title" placeholder="Judul section" class="w-full px-2.5 py-1.5 bg-white border border-neutral-200 rounded-lg focus:outline-none font-semibold" />
                        </div>
                        <textarea rows="3" v-model="section.body" placeholder="Isi deskripsi section ini..." class="w-full px-3 py-2 bg-white border border-neutral-200 rounded-xl focus:outline-none resize-none leading-relaxed"></textarea>
                      </div>
                    </div>
                    <div class="border-t border-neutral-100 pt-4 flex justify-end">
                      <button type="submit" class="px-6 py-2.5 bg-white text-black border border-neutral-150 hover:bg-brand-gold-dark rounded-xl font-semibold uppercase tracking-wider text-xs cursor-pointer shadow-md transition-all active:scale-[0.98]">
                        Simpan Highlight Background
                      </button>
                    </div>
                  </form>
                </div>

                <div v-else-if="adminTab === 'guestbook'">
                  <h3 class="text-lg font-sans font-bold text-black mb-4">Buku Tamu</h3>
                  <div class="space-y-4">
                    <div v-for="entry in guestbookEntries" :key="entry.id" class="bg-white p-5 rounded-2xl border border-neutral-200/50 shadow-sm relative group">
                      <div class="flex justify-between items-start mb-2">
                        <div>
                          <h4 class="font-sans font-bold text-black">{{entry.name}}</h4>
                          <p class="text-[10px] text-brand-muted font-sans mt-0.5">{{entry.role}} • {{entry.date}}</p>
                        </div>
                        <div class="text-xs tracking-widest text-brand-gold-dark">
                          {{'⭐'.repeat(entry.stars)}}
                        </div>
                      </div>
                      <p class="text-xs text-brand-muted mt-2 italic">&ldquo;{{entry.message}}&rdquo;</p>
                      <div class="mt-3 pt-3 border-t border-neutral-100 flex justify-between items-center text-[10px] font-sans text-brand-muted">
                        <span>Mencicipi: {{entry.dishLiked}}</span>
                      </div>
                    </div>
                  </div>
                </div>

            </div>
          </div>
        </div>
      </main>

      <!-- spacer so page content isn't hidden behind the fixed mobile tab bar
           (placed after </main>, not before, so it reserves space at the
           BOTTOM of the scrollable content instead of pushing every page
           down from the top) -->
      <div class="mobile-tab-bar-spacer lg:hidden"></div>

      <!-- DETAIL MODAL SCREEN -->
      <transition name="fade">
        <div v-if="selectedDish" class="fixed inset-0 z-[80] flex items-center justify-center p-3 md:p-6 text-left">
          <div @click="selectedDish = null" class="absolute inset-0 bg-brand-charcoal/80 backdrop-blur-md cursor-pointer"></div>
          
          <div class="bg-neutral-200 w-full max-w-[1900px] md:aspect-[2880/1080] rounded-[32px] p-1.5 md:p-2.5 shadow-[0_30px_80px_-10px_rgba(139,130,115,0.35)] relative border border-neutral-300 z-10 max-h-[92vh] flex flex-col">
            <!-- Stacked sheets visual effect -->
            <div class="absolute inset-0 bg-white/60 rounded-[32px] -rotate-[0.5deg] -translate-x-1 translate-y-0.5 border border-neutral-200/75 pointer-events-none -z-10"></div>
            <div class="absolute inset-0 bg-brand-cream/80 rounded-[32px] rotate-[0.3deg] translate-x-1 translate-y-1 border border-neutral-200/75 pointer-events-none -z-10"></div>

            <!-- Inner Paper Block -->
            <div class="bg-brand-cream w-full h-full rounded-[24px] overflow-hidden border border-neutral-300 relative flex flex-col flex-1 shadow-inner">
              
              <!-- Book Crease Overlay -->
              <div class="hidden md:block absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-12 pointer-events-none z-30 bg-gradient-to-r from-transparent via-brand-charcoal/[0.1] to-transparent"></div>
              <div class="hidden md:block absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-[2px] bg-brand-charcoal/15 pointer-events-none z-30 shadow-[0_0_8px_rgba(44,40,37,0.2)]"></div>
              <div class="hidden md:block absolute top-0 bottom-0 left-[calc(50%-1px)] w-[1px] bg-white/40 pointer-events-none z-30"></div>

              <button @click="copyLink" :title="linkCopied ? 'Link copied!' : 'Copy link to this project'" class="absolute top-3 right-14 md:top-6 md:right-20 z-40 bg-brand-cream/90 text-black p-1.5 rounded-full shadow-md hover:bg-brand-bone hover:scale-105 transition-all cursor-pointer border border-neutral-300">
                <i :data-lucide="linkCopied ? 'check' : 'link'" class="h-3.5 w-3.5"></i>
              </button>

              <button @click="selectedDish = null" class="absolute top-3 right-3 md:top-6 md:right-6 z-40 bg-brand-cream/90 text-black p-1.5 rounded-full shadow-md hover:bg-brand-bone hover:scale-105 transition-all cursor-pointer border border-neutral-300">
                <i data-lucide="x" class="h-3.5 w-3.5"></i>
              </button>

              <div class="flex-1 overflow-y-auto md:overflow-hidden no-scrollbar relative">
                <div class="grid grid-cols-1 md:grid-cols-2 min-h-full md:h-full">
                  
                  <!-- LEFT PAGE (photo: landscape aspect-ratio on mobile so it doesn't
                       eat half the screen, full-bleed 4:3-ish fill on desktop) -->
                  <div class="relative aspect-[1.91/1] md:aspect-auto md:min-h-0 md:h-full border-b md:border-b-0 md:border-r border-neutral-200">
                    <div class="absolute inset-0 w-full h-full cursor-zoom-in" @click="dishPhotoLightboxOpen = true" title="Lihat foto lebih besar">
                      <img :src="selectedDishImages[selectedDishImageIndex] && selectedDishImages[selectedDishImageIndex].url" :alt="selectedDish.name" class="w-full h-full object-cover" />
                    </div>

                    <!-- Tap-to-enlarge hint icon -->
                    <div class="absolute top-3 left-3 z-20 h-7 w-7 rounded-full bg-white/85 backdrop-blur-sm text-black flex items-center justify-center shadow-md pointer-events-none">
                      <i data-lucide="eye" class="h-3.5 w-3.5"></i>
                    </div>

                    <!-- PER-PHOTO CAPTION — italic, overlaid near the bottom of the photo.
                         Only shows when the current photo actually has a caption. -->
                    <p v-if="selectedDishImages[selectedDishImageIndex] && selectedDishImages[selectedDishImageIndex].caption"
                       class="absolute inset-x-14 md:inset-x-10 bottom-6 md:bottom-12 z-20 text-center text-white italic font-sans text-sm leading-snug drop-shadow-[0_2px_10px_rgba(0,0,0,0.65)] pointer-events-none">
                      {{ selectedDishImages[selectedDishImageIndex].caption }}
                    </p>

                    <!-- PREV/NEXT PHOTO NAVIGATION — only shown when the project has more than 1 photo.
                         On mobile these sit at the bottom, aligned with the caption row, and are
                         smaller so they don't dominate the photo; on desktop (md+) they stay
                         vertically centered at their original size. -->
                    <template v-if="selectedDishImages.length > 1">
                      <button @click.stop="prevDishImage" title="Previous photo" class="absolute left-3 bottom-6 md:bottom-auto md:left-3 md:top-1/2 md:-translate-y-1/2 z-20 h-7 w-7 md:h-9 md:w-9 rounded-full bg-white/85 backdrop-blur-sm text-black flex items-center justify-center shadow-md hover:bg-white hover:scale-105 transition-all cursor-pointer border border-neutral-200/70">
                        <i data-lucide="chevron-left" class="h-3.5 w-3.5 md:h-4 md:w-4"></i>
                      </button>
                      <button @click.stop="nextDishImage" title="Next photo" class="absolute right-3 bottom-6 md:bottom-auto md:right-3 md:top-1/2 md:-translate-y-1/2 z-20 h-7 w-7 md:h-9 md:w-9 rounded-full bg-white/85 backdrop-blur-sm text-black flex items-center justify-center shadow-md hover:bg-white hover:scale-105 transition-all cursor-pointer border border-neutral-200/70">
                        <i data-lucide="chevron-right" class="h-3.5 w-3.5 md:h-4 md:w-4"></i>
                      </button>
                      <div class="hidden md:flex absolute bottom-4 left-1/2 -translate-x-1/2 z-20 items-center gap-1.5">
                        <button v-for="(img, idx) in selectedDishImages" :key="idx" @click.stop="selectedDishImageIndex = idx" :title="'Foto ' + (idx + 1)" :class="['transition-all duration-300 rounded-full', idx === selectedDishImageIndex ? 'w-5 h-1.5 bg-white' : 'w-1.5 h-1.5 bg-white/60 hover:bg-white/80']"></button>
                      </div>
                    </template>

                  </div>

                  <!-- RIGHT PAGE -->
                  <div class="md:h-full md:overflow-y-auto no-scrollbar p-6 md:pt-6 md:pb-6 md:px-7 md:pl-9 bg-brand-cream flex flex-col relative">
                    <div class="space-y-4">
                      <!-- JUDUL / TITLE -->
                      <div>
                        <span class="text-xs font-mono tracking-widest text-brand-gold font-bold uppercase block mb-2">
                          {{ selectedDish.categoryLabel }} • {{ formatProjectDate(selectedDish.price) }}
                        </span>
                        <h2 class="text-xl md:text-2xl lg:text-3xl font-sans font-semibold text-black tracking-tight leading-tight">
                          {{ selectedDish.name }}
                        </h2>
                      </div>

                      <p class="text-sm text-black italic border-l-2 border-brand-gold pl-4 py-0.5 font-sans leading-relaxed">
                        &ldquo;<span class="rich-text-content" v-html="selectedDish.shortDescription"></span>&rdquo;
                      </p>

                      <!-- SYNC BADGE — muncul kalau proyek ini disinkronkan dengan salah satu
                           entri Professional Experience (diatur di Admin > Kelola Portofolio) -->
                      <div v-if="getLinkedExperience(selectedDish)" class="flex items-start gap-2.5 text-brand-gold-dark font-mono bg-brand-bone/60 border border-brand-gold/20 rounded-xl px-3.5 py-2.5">
                        <i data-lucide="link" class="h-3.5 w-3.5 shrink-0 mt-0.5"></i>
                        <div class="min-w-0">
                          <p class="text-[10px] uppercase tracking-wider opacity-80">Part of experience</p>
                          <p class="text-xs font-bold text-black leading-snug mt-0.5">{{ getLinkedExperience(selectedDish).heading }}</p>
                          <p class="text-[10px] mt-1">{{ getLinkedExperience(selectedDish).period }}</p>
                        </div>
                      </div>

                      <!-- BORDERED / LINE-DIVIDED INFO BLOCK -->
                      <div class="border border-neutral-300 rounded-2xl overflow-hidden divide-y divide-neutral-300">

                        <!-- CHALLENGE / WHY PROBLEM -->
                        <div class="space-y-2.5 p-3.5">
                          <h4 class="font-sans font-bold text-black flex items-center gap-2 text-sm">
                            <i data-lucide="alert-triangle" class="h-4 w-4 text-brand-gold"></i>
                            Challenge / Why Problem
                          </h4>
                          <p v-if="selectedDish.chefNotes.background" class="font-sans text-brand-muted text-sm leading-relaxed rich-text-content" v-html="selectedDish.chefNotes.background">
                          </p>
                        </div>

                        <!-- SOLUTION -->
                        <div class="space-y-3 p-3.5">
                          <h4 class="font-sans font-bold text-black text-sm flex items-center gap-2">
                            <i data-lucide="lightbulb" class="h-4 w-4 text-brand-gold"></i>
                            Solution
                          </h4>
                          <ol class="space-y-3">
                            <li v-for="(step, i) in selectedDish.chefNotes.recipe" :key="i" class="flex gap-3">
                              <span class="h-5 w-5 rounded-full bg-white text-black border border-neutral-150 font-mono flex items-center justify-center flex-shrink-0 text-[10px] font-bold mt-0.5 shadow-sm">
                                {{ i + 1 }}
                              </span>
                              <div class="min-w-0">
                                <p class="font-sans text-brand-muted leading-relaxed pt-0.5 text-sm rich-text-content" v-html="step.text"></p>
                                <ul v-if="step.points && step.points.length" class="mt-2 space-y-1.5">
                                  <li v-for="(pt, pi) in step.points" :key="'sp'+pi" class="flex items-start gap-2">
                                    <span class="h-3.5 w-3.5 rounded-full bg-brand-cream text-brand-gold-dark flex items-center justify-center flex-shrink-0 mt-0.5 border border-neutral-300">
                                      <i data-lucide="check" class="h-2 w-2 font-bold"></i>
                                    </span>
                                    <span class="font-sans text-brand-muted leading-relaxed text-sm rich-text-content" v-html="pt"></span>
                                  </li>
                                </ul>
                              </div>
                            </li>
                          </ol>
                        </div>

                        <!-- IMPACT -->
                        <div class="space-y-2.5 p-3.5">
                          <h4 class="font-sans font-bold text-black text-sm flex items-center gap-2">
                            <i data-lucide="trending-up" class="h-4 w-4 text-brand-gold"></i>
                            Impact
                          </h4>
                          <ul class="space-y-2">
                            <li v-for="(res, i) in selectedDish.chefNotes.results" :key="i" class="flex items-start gap-2.5">
                              <span class="h-4.5 w-4.5 rounded-full bg-brand-cream text-brand-gold-dark flex items-center justify-center flex-shrink-0 mt-0.5 border border-neutral-300">
                                <i data-lucide="check" class="h-3 w-3 font-bold"></i>
                              </span>
                              <div class="min-w-0">
                                <span class="font-sans text-brand-muted leading-relaxed text-sm rich-text-content" v-html="res.text"></span>
                                <ul v-if="res.points && res.points.length" class="mt-2 space-y-1.5">
                                  <li v-for="(pt, pi) in res.points" :key="'rp'+pi" class="flex items-start gap-2">
                                    <span class="h-3.5 w-3.5 rounded-full bg-brand-cream text-brand-gold-dark flex items-center justify-center flex-shrink-0 mt-0.5 border border-neutral-300">
                                      <i data-lucide="check" class="h-2 w-2 font-bold"></i>
                                    </span>
                                    <span class="font-sans text-brand-muted leading-relaxed text-sm rich-text-content" v-html="pt"></span>
                                  </li>
                                </ul>
                              </div>
                            </li>
                          </ul>
                        </div>

                        <!-- WHAT MADE IT SPECIAL / WHAT I LEARNED -->
                        <div v-if="selectedDish.chefNotes.philosophy" class="space-y-2.5 p-3.5">
                          <h4 class="font-sans font-bold text-black flex items-center gap-2 text-sm">
                            <i data-lucide="sparkles" class="h-4 w-4 text-brand-gold"></i>
                            What Made It Special and What I Learned
                          </h4>
                          <p class="font-sans text-brand-muted text-sm leading-relaxed italic rich-text-content" v-html="selectedDish.chefNotes.philosophy">
                          </p>
                        </div>

                        <!-- KATA KUNCI / KEYWORDS -->
                        <div class="space-y-2 p-3.5">
                          <h4 class="font-sans font-bold text-black text-sm flex items-center gap-2">
                            <i data-lucide="tags" class="h-4 w-4 text-brand-gold"></i>
                            Kata Kunci / Keywords
                          </h4>
                          <div class="flex flex-wrap gap-1.5">
                            <span v-for="(ing, i) in selectedDish.ingredients" :key="i" class="font-mono bg-brand-cream text-black border border-neutral-300 px-2 py-0.5 rounded-full text-[10px] leading-relaxed whitespace-nowrap">
                              {{ ing }}
                            </span>
                          </div>
                        </div>

                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </transition>

      <!-- PROJECT PHOTO LIGHTBOX (public card view) — tap-to-enlarge from the
           popup's photo strip, mainly for mobile where the photo is cropped
           to a landscape strip. Shows the current photo at its real
           proportions (object-contain) and reuses the same prev/next/index
           state as the popup, so left/right navigation stays in sync with
           the regular card view underneath. -->
      <transition name="fade">
        <div v-if="dishPhotoLightboxOpen && selectedDish" @click="dishPhotoLightboxOpen = false" class="fixed inset-0 z-[90] flex items-center justify-center p-4 cursor-pointer">
          <div class="absolute inset-0 bg-brand-charcoal/90 backdrop-blur-sm"></div>

          <button type="button" @click.stop="dishPhotoLightboxOpen = false" class="absolute top-4 right-4 z-20 h-9 w-9 rounded-full bg-white/90 hover:bg-white flex items-center justify-center text-black cursor-pointer">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>

          <img :src="selectedDishImages[selectedDishImageIndex] && selectedDishImages[selectedDishImageIndex].url" :alt="selectedDish.name" @click.stop
               class="relative z-0 max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain cursor-default" />

          <p v-if="selectedDishImages[selectedDishImageIndex] && selectedDishImages[selectedDishImageIndex].caption"
             class="absolute bottom-6 inset-x-16 z-10 text-center text-white italic font-sans text-sm leading-snug drop-shadow-[0_2px_10px_rgba(0,0,0,0.65)] pointer-events-none">
            {{ selectedDishImages[selectedDishImageIndex].caption }}
          </p>

          <!-- PREV/NEXT — same nextDishImage/prevDishImage as the regular card view -->
          <template v-if="selectedDishImages.length > 1">
            <button type="button" @click.stop="prevDishImage" title="Previous photo" class="absolute left-3 md:left-6 top-1/2 -translate-y-1/2 z-20 h-9 w-9 md:h-11 md:w-11 rounded-full bg-white/85 backdrop-blur-sm text-black flex items-center justify-center shadow-md hover:bg-white hover:scale-105 transition-all cursor-pointer border border-neutral-200/70">
              <i data-lucide="chevron-left" class="h-4 w-4 md:h-5 md:w-5"></i>
            </button>
            <button type="button" @click.stop="nextDishImage" title="Next photo" class="absolute right-3 md:right-6 top-1/2 -translate-y-1/2 z-20 h-9 w-9 md:h-11 md:w-11 rounded-full bg-white/85 backdrop-blur-sm text-black flex items-center justify-center shadow-md hover:bg-white hover:scale-105 transition-all cursor-pointer border border-neutral-200/70">
              <i data-lucide="chevron-right" class="h-4 w-4 md:h-5 md:w-5"></i>
            </button>
            <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5">
              <button type="button" v-for="(img, idx) in selectedDishImages" :key="'lb-dot-'+idx" @click.stop="selectedDishImageIndex = idx" :title="'Foto ' + (idx + 1)" :class="['transition-all duration-300 rounded-full', idx === selectedDishImageIndex ? 'w-5 h-1.5 bg-white' : 'w-1.5 h-1.5 bg-white/60 hover:bg-white/80']"></button>
            </div>
          </template>
        </div>
      </transition>

      <!-- CERTIFICATE LIGHTBOX MODAL -->
      <transition name="fade">
        <div v-if="selectedCertificate" class="fixed inset-0 z-[80] flex items-center justify-center p-3 md:p-6 text-left">
          <div @click="selectedCertificate = null" class="absolute inset-0 bg-brand-charcoal/80 backdrop-blur-md cursor-pointer"></div>

          <div class="bg-white w-full max-w-3xl rounded-[24px] shadow-[0_30px_80px_-10px_rgba(139,130,115,0.35)] relative border border-neutral-300 z-10 max-h-[92vh] flex flex-col overflow-hidden">

            <button @click="copyLink" :title="linkCopied ? 'Link copied!' : 'Copy link to this credential'" class="absolute top-4 right-14 z-40 bg-brand-cream/90 text-black p-1.5 rounded-full shadow-md hover:bg-brand-bone hover:scale-105 transition-all cursor-pointer border border-neutral-300">
              <i :data-lucide="linkCopied ? 'check' : 'link'" class="h-3.5 w-3.5"></i>
            </button>

            <button @click="selectedCertificate = null" class="absolute top-4 right-4 z-40 bg-brand-cream/90 text-black p-1.5 rounded-full shadow-md hover:bg-brand-bone hover:scale-105 transition-all cursor-pointer border border-neutral-300">
              <i data-lucide="x" class="h-3.5 w-3.5"></i>
            </button>

            <div class="flex-1 overflow-y-auto no-scrollbar">
              <!-- CERTIFICATE IMAGE -->
              <div class="relative aspect-[4/3] bg-brand-bone">
                <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-brand-gold/25">
                  <i data-lucide="badge-check" class="h-14 w-14"></i>
                  <span class="text-[10px] font-mono uppercase tracking-widest text-brand-muted/50">Credential</span>
                </div>
                <img v-if="selectedCertificate.image" :src="selectedCertificate.image" :alt="selectedCertificate.title" @error="$event.target.style.display='none'"
                     class="absolute inset-0 w-full h-full object-contain" />
              </div>

              <!-- CERTIFICATE INFO -->
              <div class="p-6 md:p-8 space-y-4">
                <div>
                  <span class="text-xs font-mono tracking-widest text-brand-gold font-bold uppercase block mb-2">{{ selectedCertificate.category }}</span>
                  <h2 class="text-2xl md:text-3xl font-serif font-semibold text-black tracking-tight leading-tight">
                    {{ selectedCertificate.title }}
                  </h2>
                  <p class="text-sm text-brand-muted mt-2">{{ selectedCertificate.issuer }}</p>
                </div>

                <div class="border border-neutral-200 rounded-2xl divide-y divide-neutral-200 overflow-hidden">
                  <div class="flex items-center justify-between px-4 py-3">
                    <span class="text-xs text-brand-muted flex items-center gap-2"><i data-lucide="calendar" class="h-3.5 w-3.5 text-brand-gold"></i>Issue Date</span>
                    <span class="text-xs font-mono font-bold text-black">{{ formatCertificateDate(selectedCertificate.date) }}</span>
                  </div>
                  <div v-if="selectedCertificate.credentialId" class="flex items-center justify-between px-4 py-3">
                    <span class="text-xs text-brand-muted flex items-center gap-2"><i data-lucide="hash" class="h-3.5 w-3.5 text-brand-gold"></i>Credential ID</span>
                    <span class="text-xs font-mono font-bold text-black">{{ selectedCertificate.credentialId }}</span>
                  </div>
                </div>

                <div class="flex flex-wrap items-center gap-3">
                  <a v-if="selectedCertificate.credentialUrl" :href="selectedCertificate.credentialUrl" target="_blank"
                     class="inline-flex items-center gap-2 text-xs font-mono font-bold text-black bg-white border border-neutral-150 px-4 py-2.5 rounded-full hover:bg-brand-gold-dark transition-colors">
                    Verifikasi Kredensial <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
                  </a>

                  <a v-if="selectedCertificate.supportingLinkUrl" :href="selectedCertificate.supportingLinkUrl" target="_blank"
                     class="inline-flex items-center gap-2 text-xs font-mono font-bold text-black bg-white border border-neutral-150 px-4 py-2.5 rounded-full hover:bg-brand-gold-dark transition-colors">
                    {{ selectedCertificate.supportingLinkLabel || "Link Pendukung" }} <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </transition>

      <!-- IMAGE CROP MODAL — muncul sebelum foto manapun di admin panel diupload,
           biar bisa digeser/diperbesar/dipilih bagian mana yg mau dipakai. -->
      <transition name="fade">
        <div v-if="cropModalOpen" class="fixed inset-0 z-[95] flex items-center justify-center p-4">
          <div @click="closeCropModal" class="absolute inset-0 bg-brand-charcoal/80 backdrop-blur-sm cursor-pointer"></div>
          <div class="bg-white w-full max-w-lg rounded-3xl p-6 relative shadow-2xl z-10 text-left border border-neutral-200">
            <button type="button" @click="closeCropModal" class="absolute top-4 right-4 h-8 w-8 rounded-full hover:bg-neutral-100 flex items-center justify-center text-brand-muted cursor-pointer">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
            <h3 class="font-sans text-lg font-bold text-black mb-1">Adjust Photo</h3>
            <p class="text-xs text-brand-muted mb-4">Drag and zoom to choose which part of the photo to display.</p>

            <div class="w-full h-72 bg-neutral-100 rounded-2xl overflow-hidden">
              <img id="cropperImage" :src="cropImageUrl" class="max-w-full block" />
            </div>

            <div class="flex items-center gap-3 mt-4">
              <button type="button" @click="cropZoomStep(-0.1)" class="nav-raised h-9 w-9 rounded-full bg-white flex items-center justify-center text-black cursor-pointer shrink-0">
                <i data-lucide="zoom-out" class="h-4 w-4"></i>
              </button>
              <input type="range" min="0" max="3" step="0.01" v-model.number="cropZoomValue" @input="setCropZoom" class="flex-1 accent-brand-gold-dark cursor-pointer" />
              <button type="button" @click="cropZoomStep(0.1)" class="nav-raised h-9 w-9 rounded-full bg-white flex items-center justify-center text-black cursor-pointer shrink-0">
                <i data-lucide="zoom-in" class="h-4 w-4"></i>
              </button>
            </div>

            <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-neutral-100">
              <button type="button" @click="closeCropModal" class="chip-raised px-4 py-2 rounded-xl text-black text-xs font-sans font-semibold cursor-pointer">Cancel</button>
              <button type="button" @click="confirmCrop" class="btn-raised px-6 py-2 rounded-xl text-black text-xs font-sans font-semibold uppercase cursor-pointer">Use Photo</button>
            </div>
          </div>
        </div>
      </transition>

      <!-- PROJECT PHOTO PREVIEW LIGHTBOX — simple full-size view triggered by
           the eye icon on each thumbnail in the "Gambar Proyek" admin grid. -->
      <transition name="fade">
        <div v-if="previewImageUrl" @click="previewImageUrl = null" class="fixed inset-0 z-[97] flex items-center justify-center p-4 cursor-pointer">
          <div class="absolute inset-0 bg-brand-charcoal/85 backdrop-blur-sm"></div>
          <button type="button" @click="previewImageUrl = null" class="absolute top-4 right-4 z-10 h-9 w-9 rounded-full bg-white/90 hover:bg-white flex items-center justify-center text-black cursor-pointer">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
          <img :src="previewImageUrl" @click.stop class="relative z-0 max-w-full max-h-[88vh] rounded-2xl shadow-2xl object-contain cursor-default" />
        </div>
      </transition>

      <!-- LOGIN MODAL -->
      <transition name="fade">
        <div v-if="isLoginModalOpen" class="fixed inset-0 z-[80] flex items-center justify-center p-4">
          <div @click="isLoginModalOpen = false" class="absolute inset-0 bg-brand-charcoal/70 backdrop-blur-sm cursor-pointer"></div>
          <div class="bg-brand-cream w-full max-w-md rounded-3xl p-6 relative shadow-2xl z-10 text-left border border-neutral-200">
            <button @click="isLoginModalOpen = false" class="absolute top-4 right-4 h-8 w-8 rounded-full hover:bg-neutral-100 flex items-center justify-center text-brand-muted">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
            <div class="text-center space-y-2 mb-6">
              <div class="h-12 w-12 rounded-full bg-neutral-100 flex items-center justify-center mx-auto text-black">
                <i data-lucide="lock" class="h-5 w-5"></i>
              </div>
              <h3 class="font-sans text-xl font-bold">Private Archive Login</h3>
            </div>
            <form @submit.prevent="handleLogin" class="space-y-4">
              <input type="password" v-model="password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-white border border-neutral-200 rounded-xl focus:outline-none" />
              <div v-if="loginError" class="bg-red-50 text-red-800 text-xs p-3 rounded-xl">{{loginError}}</div>
              <button type="submit" class="btn-raised w-full py-2.5 text-black rounded-xl font-sans font-semibold uppercase text-xs">Log In</button>
            </form>
          </div>
        </div>
      </transition>
      </transition>
      </template>
    </div>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>

    <!-- Init App -->
    <script src="app.js"></script>
    <!-- Select-to-translate: muncul tombol "Terjemahkan ke Indonesia" saat
         pengunjung memblok/menyeleksi teks di halaman ini. -->
    <script src="translate-select.js"></script>
    <style>
      .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
      .fade-enter-from, .fade-leave-to { opacity: 0; }
      /* Speed-dial social icons (Contact button) — rise + scale in instead of
         an instant opacity swap, so they feel like they're popping up out of
         the button rather than just appearing. */
      .popup-fade-enter-active { transition: opacity 0.22s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .popup-fade-leave-active { transition: opacity 0.15s ease, transform 0.15s ease; }
      .popup-fade-enter-from, .popup-fade-leave-to { opacity: 0; transform: translateY(10px) scale(0.85); }
      /* Selaraskan header "Review Pelanggan" dengan header "Tulis Ulasan Anda"
         (kartu kiri punya padding 1.5rem sebelum kontennya, kolom kanan perlu offset yang sama) */
      @media (min-width: 768px) {
        .guestbook-right-col { padding-top: 1.5rem; }
      }
    </style>
  </body>
</html>
